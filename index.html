<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smriti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2236%22 fill=%22%2360a5fa%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12315c; --ink-soft:rgba(18,49,92,.66); --line:rgba(60,120,200,.2);
  --glass:rgba(255,255,255,.48); --glass-hi:rgba(255,255,255,.78); --base:rgba(255,255,255,.4);
  --blue:#60a5fa; --blue-deep:#2563eb; --cyan:#38bdf8;
  --c-none:rgba(255,255,255,.30); --c-sage:rgba(103,225,240,.30); --c-sky:rgba(96,165,250,.26);
  --c-lilac:rgba(167,139,250,.22); --c-peach:rgba(253,186,116,.30); --c-rose:rgba(251,146,182,.24);
  --shadow:0 12px 34px -14px rgba(30,80,170,.38),inset 0 1px 0 rgba(255,255,255,.95);
  --serif:'Fraunces',Georgia,serif; --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);line-height:1.6;
  background:linear-gradient(140deg,#e4f3ff 0%,#c4e2ff 48%,#a3d3fb 100%) fixed;color-scheme:light}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(480px 480px at 10% 12%,rgba(255,255,255,.95),transparent 70%),
             radial-gradient(560px 520px at 90% 18%,rgba(147,197,253,.65),transparent 70%),
             radial-gradient(620px 520px at 65% 100%,rgba(125,211,252,.6),transparent 70%),
             radial-gradient(420px 420px at 0% 90%,rgba(165,180,252,.45),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
select option{color:#0f2a5c;background:#fff}
:focus-visible{outline:2px solid var(--blue-deep);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:26px 18px;display:flex;flex-direction:column;gap:26px;
  background:var(--glass);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  border-right:1px solid var(--line);box-shadow:inset -1px 0 0 rgba(255,255,255,.7)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand b{font-family:var(--serif);font-weight:700;font-size:2rem;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--ink-soft);text-decoration:none;font-weight:500;border:1px solid transparent;transition:background .25s,color .25s}
.nav a:hover{background:var(--glass);color:var(--ink)}
.nav a.on{background:var(--glass-hi);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.nav a.on svg{color:var(--blue-deep)}
.nav em{margin-left:auto;font-style:normal;font-size:.78rem;background:rgba(37,99,235,.14);color:#1d4ed8;padding:1px 9px;border-radius:999px}
.newbtn{margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:11px 22px;font-weight:600;font-size:.95rem;cursor:pointer;
  background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;box-shadow:0 8px 22px -6px rgba(37,99,235,.7),inset 0 1px 0 rgba(255,255,255,.45);transition:filter .25s,transform .2s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:scale(.98)}
.btn.quiet{background:var(--glass);box-shadow:none;color:var(--ink)}
.side-tip{font-size:.8rem;color:var(--ink-soft);padding:0 8px}

main{padding:46px clamp(20px,4vw,56px) 80px;max-width:1040px;width:100%}
.top{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.top h1{font-family:var(--serif);font-weight:400;font-size:2.5rem;line-height:1.1;margin:0;text-shadow:0 1px 14px rgba(255,255,255,.8)}
.top p{margin:6px 0 0;color:var(--ink-soft)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--ink-soft);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.search input{border:0;background:none;outline:none;width:170px}
.group{font-family:var(--serif);font-size:1.1rem;margin:28px 0 14px;color:var(--ink-soft);font-weight:400}

.grid{columns:2 270px;column-gap:18px}
.note{break-inside:avoid;margin:0 0 18px;padding:20px 20px 14px;border-radius:24px;
  background-color:var(--base);background-image:linear-gradient(var(--bg,var(--c-none)),var(--bg,var(--c-none)));
  border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  transition:transform .3s,border-color .3s}
.note:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.95)}
.note h3{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 0 6px;line-height:1.3}
.note p{margin:0;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:var(--ink)}
.badge.done{opacity:.65}
.badge svg{width:14px;height:14px}
.acts{margin-left:auto;display:flex;gap:2px}
.ic{border:0;background:none;color:var(--ink-soft);cursor:pointer;padding:7px;border-radius:10px;display:grid;place-items:center;transition:background .2s,color .2s}
.ic:hover{background:rgba(37,99,235,.12);color:var(--ink)}
.ic.on{color:var(--blue-deep)} .ic.on svg{fill:currentColor}
.pinmark{float:right;color:var(--blue-deep);margin:-2px -4px 0 8px}
.pinmark svg{width:16px;height:16px;fill:currentColor}

.timeline{display:grid;gap:14px}
.rem{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start}
.when{text-align:right;padding-top:18px}
.when b{display:block;font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.1}
.when span{font-size:.82rem;color:var(--ink-soft)}
.rem .note{margin:0}

.empty{text-align:center;padding:70px 20px;color:var(--ink-soft)}
.empty h2{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0 0 6px}

/* modal + alert */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:30;background:rgba(190,220,255,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.overlay.show{display:flex;animation:fade .5s both}
#alertBox{z-index:40}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:30px;padding:26px;
  background-color:rgba(255,255,255,.7);background-image:linear-gradient(var(--bg,var(--c-none)),var(--bg,var(--c-none)));
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);transition:background .4s}
.sheet .title,.sheet .body{width:100%;border:0;background:transparent;outline:none;resize:none}
.title{font-family:var(--serif);font-size:1.5rem;padding:0 0 8px}
.body{min-height:110px;font-size:1.02rem}
::placeholder{color:var(--ink-soft);opacity:.75}
.label{display:block;font-size:.85rem;color:var(--ink-soft);margin:18px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:.88rem;cursor:pointer;transition:background .2s}
.chip:hover{background:var(--glass-hi)} .chip.on{background:linear-gradient(135deg,#60a5fa,#2563eb);border-color:rgba(255,255,255,.4);color:#fff}
.field{border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:8px 12px;font-size:.92rem}
.dots{display:flex;gap:10px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.9);cursor:pointer;background-color:#fff;background-image:linear-gradient(var(--d),var(--d))}
.dot.on{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.hint{font-size:.8rem;color:var(--ink-soft);margin:14px 0 0}

.alert{width:min(440px,100%);text-align:center;padding:34px 28px 28px;border-radius:32px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.halo{width:120px;height:120px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 32% 28%,#fff,var(--cyan) 38%,var(--blue-deep) 100%);
  box-shadow:0 0 0 14px rgba(56,189,248,.18),0 0 0 32px rgba(56,189,248,.09),0 0 60px rgba(56,189,248,.45);animation:breathe 6s ease-in-out infinite}
.alert .sm{color:var(--ink-soft);font-size:.9rem;margin:0}
.alert h2{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:6px 0 8px}
.alert .txt{margin:0;white-space:pre-wrap;max-height:120px;overflow:auto}
.snooze{display:flex;gap:8px;justify-content:center;margin:20px 0 14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);color:var(--ink);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px 18px;border-radius:999px;font-size:.9rem;transition:all .4s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fab{display:none}
@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:820px){
  .app{display:block}
  aside{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;flex-direction:row;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);gap:0}
  .brand,.newbtn,.side-tip{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:6px 10px;font-size:.72rem;position:relative}
  .nav em{position:absolute;top:0;right:2px;margin:0;font-size:.65rem;padding:0 6px}
  main{padding:30px 18px 120px}
  .top h1{font-size:2rem} .search{margin-left:0;width:100%} .search input{width:100%}
  .rem{grid-template-columns:1fr;gap:4px} .when{text-align:left;padding:0;display:flex;gap:8px;align-items:baseline}
  .fab{display:grid;place-items:center;position:fixed;right:20px;bottom:86px;width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;box-shadow:var(--shadow);z-index:20;cursor:pointer}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>Smriti</b></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <button class="btn newbtn" id="newBtn"></button>
    <p class="side-tip">Keep this tab open so reminders can reach you.</p>
  </aside>
  <main>
    <div class="top">
      <div><h1 id="pgTitle"></h1><p id="pgSub"></p></div>
      <label class="search"><span id="srIcon"></span><input id="search" type="search" placeholder="Search" aria-label="Search notes"></label>
    </div>
    <div id="view"></div>
  </main>
</div>
<button class="fab" id="fab" aria-label="New note"></button>

<div class="overlay" id="composer">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Note">
    <input id="title" class="title" placeholder="Title" maxlength="80">
    <textarea id="body" class="body" placeholder="What would you like to remember?"></textarea>
    <span class="label">Colour</span>
    <div class="dots" id="dots"></div>
    <span class="label">Remind me</span>
    <div class="row">
      <button class="chip" data-in="10">In 10 minutes</button>
      <button class="chip" data-in="60">In 1 hour</button>
      <button class="chip" data-when="evening">This evening</button>
      <button class="chip" data-when="tomorrow">Tomorrow morning</button>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="when" type="datetime-local" class="field" aria-label="Reminder time">
      <select id="sound" class="field" aria-label="Alarm sound">
        <option value="alarm">Classic alarm</option><option value="chime">Soft chime</option><option value="bell">Temple bell</option>
        <option value="drops">Water drops</option><option value="silent">Silent</option>
      </select>
      <button class="chip" id="preview">Listen</button>
      <button class="chip" id="clearWhen">No reminder</button>
    </div>
    <div class="row" style="margin-top:14px"><button class="chip" id="pinChip">Pin this note</button></div>
    <p class="hint" id="permHint"></p>
    <div class="foot"><button class="btn quiet" id="cancel">Cancel</button><button class="btn" id="save">Save note</button></div>
  </div>
</div>

<div class="overlay" id="alertBox" role="alertdialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="alert">
    <div class="halo" aria-hidden="true"></div>
    <p class="sm">A gentle reminder</p>
    <h2 id="aTitle"></h2><p class="txt" id="aText"></p>
    <div class="snooze">
      <button class="chip" data-snooze="5">Snooze 5 min</button><button class="chip" data-snooze="10">10 min</button><button class="chip" data-snooze="30">30 min</button>
    </div>
    <button class="btn" id="dismiss">Done</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {
  note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6"/>',
  pin:'<path d="M12 17v5M8 3h8l-1 6 3 4H6l3-4z"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  archive:'<path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  restore:'<path d="M4 12a8 8 0 1 0 3-6M4 4v5h5"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const VIEWS = {
  notes:{t:'Notes',s:'Everything you have written down.',i:'note'},
  pinned:{t:'Pinned',s:'The things you want to keep close.',i:'pin'},
  reminders:{t:'Reminders',s:'What Smriti will bring back to you.',i:'bell'},
  archive:{t:'Archive',s:'Put away, never lost.',i:'archive'}
};
const COLORS = ['none','sage','sky','lilac','peach','rose'];
const KEY = 'smriti.notes.v1';
let notes = [];
try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
notes.forEach(n => { n.pinned = !!n.pinned; n.archived = !!n.archived; n.color = n.color || 'none'; });
let view = 'notes', editingId = null, draft = {}, alerting = null, loop = null;
const baseTitle = document.title;
const inAndroidApp = window.Capacitor?.getPlatform?.() === 'android';
let mobileAlarm = null;
const mobileReady = inAndroidApp
  ? import('./mobile-bridge.js').then(() => window.SmritiMobile)
  : Promise.resolve(null);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { toast('Could not save in this browser.'); } };
const find = id => notes.find(n => n.id === id);

let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2400); }

/* ---------- sound ---------- */
let ctx;
let audioUnavailableNotified = false;
const audio = () => {
  const AudioContextType = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextType) {
    if (!audioUnavailableNotified) { toast('Alarm sound is not supported by this browser.'); audioUnavailableNotified = true; }
    return null;
  }
  ctx = ctx || new AudioContextType();
  if (ctx.state==='suspended') ctx.resume().catch(() => toast('Allow sound in your browser to hear alarms.'));
  return ctx;
};
function tone(f,t,d,type='sine',g=.16){ const c=audio(); if (!c) return; const o=c.createOscillator(),v=c.createGain(),s=c.currentTime+t;
  o.type=type;o.frequency.value=f;o.connect(v);v.connect(c.destination);
  v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(g,s+.03);v.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05); }
const SOUNDS = {
  alarm:()=>[0,.35,.7,1.05].forEach(t=>tone(880,t,.24,'square',.18)),
  chime:()=>[523,659,784].forEach((f,i)=>tone(f,i*.4,1.8)),
  bell:()=>{tone(440,0,3,'sine',.18);tone(880,0,1.6,'sine',.07);tone(660,0,2,'sine',.05)},
  drops:()=>[784,988,659,880].forEach((f,i)=>tone(f,i*.28,.8,'triangle',.1)),
  silent:()=>{}
};
const play = k => (SOUNDS[k]||SOUNDS.chime)();
document.addEventListener('pointerdown', () => { try{audio()}catch(e){} }, {once:true});

/* ---------- time helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const timeOf = ts => new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function dayOf(ts){
  const d=new Date(ts).setHours(0,0,0,0), t=new Date().setHours(0,0,0,0), diff=Math.round((d-t)/864e5);
  return diff===0?'Today':diff===1?'Tomorrow':diff===-1?'Yesterday':new Date(ts).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
}

/* ---------- cards ---------- */
function card(n){
  const badge = n.remindAt ? `<span class="badge ${n.fired?'done':''}">${ic('bell')}${n.fired?'Reminded ':''}${dayOf(n.remindAt)}, ${timeOf(n.remindAt)}</span>` : '';
  const acts = n.archived
    ? `<button class="ic" data-a="archive" data-id="${n.id}" title="Restore">${ic('restore')}</button><button class="ic" data-a="del" data-id="${n.id}" title="Delete">${ic('trash')}</button>`
    : `<button class="ic ${n.pinned?'on':''}" data-a="pin" data-id="${n.id}" title="${n.pinned?'Unpin':'Pin'}">${ic('pin')}</button>
       <button class="ic" data-a="edit" data-id="${n.id}" title="Edit">${ic('edit')}</button>
       <button class="ic" data-a="archive" data-id="${n.id}" title="Archive">${ic('archive')}</button>
       <button class="ic" data-a="del" data-id="${n.id}" title="Delete">${ic('trash')}</button>`;
  return `<article class="note" style="--bg:var(--c-${n.color})">
    ${n.pinned&&view==='notes'?`<span class="pinmark" title="Pinned">${ic('pin')}</span>`:''}
    ${n.title?`<h3>${esc(n.title)}</h3>`:''}${n.text?`<p>${esc(n.text)}</p>`:''}
    <div class="meta">${badge}<div class="acts">${acts}</div></div></article>`;
}
const byNew = (a,b) => b.created - a.created;
function empty(h,p){ return `<div class="empty"><h2>${h}</h2><p>${p}</p></div>`; }

function render(){
  const v = VIEWS[view], q = $('#search').value.trim().toLowerCase();
  $('#pgTitle').textContent = v.t; $('#pgSub').textContent = v.s; document.title = v.t + ' · Smriti';
  const match = n => !q || (n.title+' '+n.text).toLowerCase().includes(q);
  const live = notes.filter(n => !n.archived);
  const counts = {notes:live.length, pinned:live.filter(n=>n.pinned).length, reminders:live.filter(n=>n.remindAt&&!n.fired).length, archive:notes.length-live.length};
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k,x]) =>
    `<a href="#${k}" class="${k===view?'on':''}" ${k===view?'aria-current="page"':''}>${ic(x.i)}${x.t}${counts[k]?`<em>${counts[k]}</em>`:''}</a>`).join('');

  let html = '';
  if (view==='notes'){
    const l = live.filter(match).sort((a,b)=>(b.pinned-a.pinned)||byNew(a,b));
    html = l.length ? `<div class="grid">${l.map(card).join('')}</div>` : empty(q?'Nothing found':'A quiet page', q?'Try a different word.':'Press New note to write your first one.');
  } else if (view==='pinned'){
    const l = live.filter(n=>n.pinned&&match(n)).sort(byNew);
    html = l.length ? `<div class="grid">${l.map(card).join('')}</div>` : empty('Nothing pinned', 'Tap the pin on any note to keep it here.');
  } else if (view==='archive'){
    const l = notes.filter(n=>n.archived&&match(n)).sort(byNew);
    html = l.length ? `<div class="grid">${l.map(card).join('')}</div>` : empty('Archive is empty', 'Notes you put away will rest here.');
  } else {
    const r = live.filter(n=>n.remindAt&&match(n));
    const up = r.filter(n=>!n.fired).sort((a,b)=>a.remindAt-b.remindAt), dn = r.filter(n=>n.fired).sort((a,b)=>b.remindAt-a.remindAt);
    const row = n => `<div class="rem"><div class="when"><b>${timeOf(n.remindAt)}</b><span>${dayOf(n.remindAt)}</span></div>${card(n)}</div>`;
    html = (up.length?`<h2 class="group">Coming up</h2><div class="timeline">${up.map(row).join('')}</div>`:'')
         + (dn.length?`<h2 class="group">Already reminded</h2><div class="timeline">${dn.map(row).join('')}</div>`:'')
         || empty('No reminders yet','Add a time to any note and it will show up here.');
  }
  $('#view').innerHTML = html;
}

/* ---------- routing ---------- */
function route(){ const h = location.hash.slice(1); view = VIEWS[h] ? h : 'notes'; render(); }
window.addEventListener('hashchange', route);
$('#search').addEventListener('input', render);

/* ---------- note actions ---------- */
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const n = find(b.dataset.id); if (!n) return;
  if (b.dataset.a==='pin'){ n.pinned=!n.pinned; toast(n.pinned?'Pinned.':'Unpinned.'); }
  else if (b.dataset.a==='archive'){ n.archived=!n.archived; toast(n.archived?'Moved to Archive.':'Restored to Notes.'); }
  else if (b.dataset.a==='edit'){ return openComposer(n.id); }
  else if (b.dataset.a==='del'){
    if(!confirm('Delete this note for good?')) return;
    if (inAndroidApp) {
      try { await (await mobileReady).alarm.cancel({id:n.id}); }
      catch (error) { toast(`Could not cancel alarm: ${error.message}`); return; }
    }
    notes=notes.filter(x=>x!==n); toast('Note deleted.');
  }
  save(); render();
});

/* ---------- composer ---------- */
$('#dots').innerHTML = COLORS.map(c => `<button class="dot" data-c="${c}" style="--d:var(--c-${c})" aria-label="${c}"></button>`).join('');
$('#newBtn').innerHTML = ic('plus') + 'New note'; $('#fab').innerHTML = ic('plus'); $('#srIcon').innerHTML = ic('search');
$('#newBtn').onclick = $('#fab').onclick = () => openComposer();

function paint(){
  document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', d.dataset.c===draft.color));
  $('#sheet').style.setProperty('--bg', `var(--c-${draft.color})`);
  $('#pinChip').classList.toggle('on', draft.pinned);
  $('#pinChip').textContent = draft.pinned ? 'Pinned' : 'Pin this note';
}
function openComposer(id){
  const n = id && find(id); editingId = n ? n.id : null;
  draft = n ? {color:n.color,pinned:n.pinned} : {color:'none',pinned:view==='pinned'};
  $('#title').value = n?n.title:''; $('#body').value = n?n.text:'';
  $('#when').value = n&&n.remindAt ? toLocalInput(new Date(n.remindAt)) : '';
  $('#sound').value = inAndroidApp ? (n&&n.sound==='silent'?'silent':'alarm') : n?n.sound||'chime':'alarm';
  $('#save').textContent = n ? 'Update note' : 'Save note';
  paint(); updateHint(); $('#composer').classList.add('show'); $('#body').focus();
}
const closeComposer = () => $('#composer').classList.remove('show');
$('#cancel').onclick = closeComposer;
$('#composer').addEventListener('mousedown', e => { if (e.target.id==='composer') closeComposer(); });
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeComposer();
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter' && $('#composer').classList.contains('show')) $('#save').click();
});
$('#dots').onclick = e => { const d=e.target.closest('.dot'); if(d){ draft.color=d.dataset.c; paint(); } };
$('#pinChip').onclick = () => { draft.pinned=!draft.pinned; paint(); };
document.querySelectorAll('[data-in]').forEach(b => b.onclick = () => $('#when').value = toLocalInput(new Date(Date.now()+b.dataset.in*60000)));
document.querySelectorAll('[data-when]').forEach(b => b.onclick = () => {
  const d = new Date();
  if (b.dataset.when==='evening'){ d.setHours(19,0,0,0); if(d<new Date()) d.setDate(d.getDate()+1); } else { d.setDate(d.getDate()+1); d.setHours(8,0,0,0); }
  $('#when').value = toLocalInput(d);
});
$('#clearWhen').onclick = () => $('#when').value = '';
$('#preview').onclick = () => play($('#sound').value);

function updateHint(){
  if (inAndroidApp) {
    $('#permHint').textContent = 'Android alarms ring with your phone’s alarm sound until you dismiss or snooze them. Allow notifications and exact alarms when prompted.';
    return;
  }
  const p = 'Notification' in window ? Notification.permission : 'unsupported';
  $('#permHint').textContent = p==='granted' ? 'Keep this tab open and your device volume on for the alarm.' : p==='denied' ? 'Notifications are blocked, but the in-page alarm and sound still work. Keep this tab open and your device volume on.' : 'Keep this tab open and your device volume on for the alarm. Allow notifications to be alerted from other tabs.';
}
async function prepareMobileAlarm(){
  if (!inAndroidApp) return true;
  const bridge = await mobileReady;
  mobileAlarm = bridge.alarm;
  const notifications = await mobileAlarm.requestNotificationPermission();
  if (!notifications.granted) {
    toast('Enable notifications for Smriti to use alarms.');
    return false;
  }
  const exact = await mobileAlarm.checkExactAlarmPermission();
  if (!exact.granted) {
    await mobileAlarm.requestExactAlarmPermission();
    toast('Allow Alarms & reminders for Smriti, then save the reminder again.');
    return false;
  }
  return true;
}
$('#save').onclick = async () => {
  const title=$('#title').value.trim(), text=$('#body').value.trim(), w=$('#when').value;
  if (!title && !text){ toast('Write something first.'); return $('#body').focus(); }
  const remindAt = w ? new Date(w).getTime() : null;
  if (remindAt && inAndroidApp) {
    try {
      if (!await prepareMobileAlarm()) return;
    } catch (error) {
      toast(`Could not prepare Android alarm: ${error.message}`);
      return;
    }
  }
  if (remindAt && !inAndroidApp) audio();
  if (remindAt && !inAndroidApp && 'Notification' in window && Notification.permission==='default') Notification.requestPermission().then(updateHint);
  const id = editingId || Date.now().toString(36);
  const data = {title,text,remindAt,sound:$('#sound').value,fired:false,color:draft.color,pinned:draft.pinned};
  try {
    if (inAndroidApp) {
      mobileAlarm = (await mobileReady).alarm;
      if (remindAt) await mobileAlarm.schedule({id,title,body:text,at:remindAt,silent:data.sound==='silent'});
      else if (editingId) await mobileAlarm.cancel({id});
    }
  } catch (error) {
    toast(`Could not set alarm: ${error.message}`);
    return;
  }
  if (editingId) Object.assign(find(editingId), data);
  else notes.unshift({id,created:Date.now(),archived:false,...data});
  toast(editingId?'Note updated.':remindAt?`Saved. Reminder set for ${dayOf(remindAt).toLowerCase()}, ${timeOf(remindAt)}.`:'Note saved.');
  save(); closeComposer(); render();
};

/* ---------- alert ---------- */
function fire(n){
  alerting = n;

  $('#aTitle').textContent = n.title || 'Your note';
  $('#aText').textContent = n.text || '';

  $('#alertBox').classList.add('show');
  $('#dismiss').focus();

  document.title = '🔔 ALARM · Smriti';

  if (!inAndroidApp) {
    play(n.sound);
    loop = setInterval(() => play(n.sound), 3000);
  }
}

// Stop active alert and cleanup
function stopAlert(){
  if (loop) { clearInterval(loop); loop = null; }
  document.title = baseTitle;
  try { $('#alertBox').classList.remove('show'); } catch(e){}
  alerting = null;
}

// Dismiss the current alert (mark as reminded)
$('#dismiss').onclick = async () => {
  if (!alerting) return;
  if (mobileAlarm) {
    try { await mobileAlarm.dismiss({id:alerting.id}); }
    catch (error) { toast(`Could not stop alarm: ${error.message}`); return; }
  }
  alerting.fired = true;
  save();
  stopAlert();
  toast('Marked as reminded.');
  render();
};

// Snooze buttons
document.querySelectorAll('[data-snooze]').forEach(b => b.addEventListener('click', async () => {
  if (!alerting) return;
  const mins = parseInt(b.dataset.snooze, 10) || 5;
  const remindAt = Date.now() + mins * 60000;
  if (mobileAlarm) {
    try { await mobileAlarm.snooze({id:alerting.id,at:remindAt}); }
    catch (error) { toast(`Could not snooze alarm: ${error.message}`); return; }
  }
  alerting.remindAt = remindAt;
  alerting.fired = false;
  save();
  stopAlert();
  toast(`Snoozed ${mins} minutes`);
  render();
}));

// Desktop notification helper
function notify(n){
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted'){
    try{
      const notif = new Notification(n.title || 'Reminder', { body: n.text || '', tag: n.id, silent: n.sound === 'silent' });
      notif.onclick = () => { window.focus(); };
    }catch(e){}
  } else if (Notification.permission === 'default') {
    Notification.requestPermission().then(updateHint);
  }
}

// Check for due reminders and fire them
function checkReminders(){
  if (inAndroidApp) {
    if (mobileAlarm) syncMobileAlarmStates();
    return;
  }
  if (alerting) return;
  const now = Date.now();
  const due = notes.filter(n => n.remindAt && !n.fired && n.remindAt <= now)
    .sort((a,b) => a.remindAt-b.remindAt)[0];
  if (!due) return;
  due.fired = true;
  save();
  render();
  notify(due);
  fire(due);
}

async function syncMobileAlarmStates(){
  try {
    const result = await mobileAlarm.getStates();
    let changed = false;
    for (const state of result.reminders || []) {
      const note = find(state.id);
      if (!note) {
        await mobileAlarm.cancel({id:state.id});
        continue;
      }
      if (state.state === 'dismissed') {
        if (!note.fired) { note.fired = true; changed = true; }
        if (alerting && alerting.id === note.id) stopAlert();
      } else if (state.state === 'scheduled') {
        if (note.remindAt !== state.at || note.fired) {
          note.remindAt = state.at;
          note.fired = false;
          changed = true;
        }
        if (alerting && alerting.id === note.id) stopAlert();
      } else if (state.state === 'ringing') {
        if (!note.fired) { note.fired = true; changed = true; }
        if (!alerting) fire(note);
      }
    }
    if (changed) { save(); render(); }
  } catch (error) {
    toast(`Could not check Android alarms: ${error.message}`);
  }
}

async function initializeMobileAlarms(){
  if (!inAndroidApp) return;
  try {
    const bridge = await mobileReady;
    mobileAlarm = bridge.alarm;
    $('#sound').innerHTML = '<option value="alarm">Phone alarm sound (repeats)</option><option value="silent">Silent</option>';
    $('#preview').hidden = true;
    const { reminders = [] } = await mobileAlarm.getStates();
    const states = new Map(reminders.map(item => [item.id, item]));
    let changed = false;
    for (const note of notes) {
      const state = states.get(note.id);
      if (state?.state === 'dismissed') {
        if (!note.fired) { note.fired = true; changed = true; }
      } else if (state?.state === 'ringing') {
        if (!note.fired) { note.fired = true; changed = true; }
      } else if (state?.state === 'scheduled' && note.remindAt !== state.at) {
        note.remindAt = state.at;
        note.fired = false;
        changed = true;
      }
    }
    if (changed) save();
    render();
    const exact = await mobileAlarm.checkExactAlarmPermission();
    for (const note of notes) {
      if (!note.remindAt || note.fired) continue;
      const state = states.get(note.id);
      if (state?.state === 'ringing' || state?.state === 'dismissed') continue;
      if (!exact.granted) {
        toast('Enable Alarms & reminders for Smriti to restore pending alarms.');
        break;
      }
      if (!state || state.at !== note.remindAt) {
        await mobileAlarm.schedule({
          id:note.id,title:note.title || 'Smriti reminder',body:note.text || '',
          at:note.remindAt,silent:note.sound === 'silent'
        });
      }
    }
    await syncMobileAlarmStates();
  } catch (error) {
    toast(`Could not initialize Android alarms: ${error.message}`);
  }
}

// Start the reminder checker (run on load and then every 5 seconds)
route();
if (inAndroidApp) initializeMobileAlarms();
setInterval(checkReminders, 5000);
checkReminders();
</script>
</body>
</html>
